[package]
name = "sandbox-app"
version = "0.7.8-beta.1"
description = "Local-first visual workflow automation"
authors = ["sndbox"]
edition = "2021"

[lib]
name = "sandbox_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sandbox-engine = { path = "engine" }
sandbox-plugin-runtime = { path = "plugin-runtime" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
async-trait = "0.1"
notify = "8"
globset = "0.4"
keyring = { version = "4.1", features = ["v1"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
url = "2"
semver = "1"
aes-gcm = "0.10"
urlencoding = "2"
ed25519-dalek = { version = "3", features = ["pem"] }

[dev-dependencies]
ed25519-dalek = { version = "3", features = ["pem", "rand_core"] }
tempfile = "3"
zip = { version = "8.6.0", default-features = false }

[workspace]
members = ["engine", "plugin-runtime"]
