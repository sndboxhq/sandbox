services:
  website:
    image: ghcr.io/sndboxhq/sandbox-marketing:${SANDBOX_VERSION:-0.8.0-beta.1}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3100
      SANDBOX_RELEASE_MANIFEST_URL: ${SANDBOX_RELEASE_MANIFEST_URL:-https://github.com/sndboxhq/sandbox/releases/download/v0.8.0-beta.1/release-manifest.json}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_NODE_RESOURCE_DETECTORS: env,os,process
      OTEL_SERVICE_NAME: sandbox-marketing
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sandbox,deployment.environment=${OTEL_DEPLOYMENT_ENVIRONMENT:-production},deployment.environment.name=${OTEL_DEPLOYMENT_ENVIRONMENT:-production},service.version=${SANDBOX_VERSION:-0.8.0-beta.1}
      OTEL_METRIC_EXPORT_INTERVAL: 60000
    ports:
      - "${SANDBOX_HTTP_BIND:-127.0.0.1}:3100:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m

  account:
    image: ghcr.io/sndboxhq/sandbox-account:${SANDBOX_VERSION:-0.8.0-beta.1}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3300
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-https://api.sndbox.app}
      OIDC_AUTHORIZE_URL: ${OIDC_AUTHORIZE_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://app.sndbox.app/auth/callback}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-https://api.sndbox.app}
    ports:
      - "${SANDBOX_HTTP_BIND:-127.0.0.1}:3300:3300"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      website:
        condition: service_healthy
      account:
        condition: service_healthy
    environment:
      SANDBOX_DOMAIN: ${SANDBOX_DOMAIN:-sndbox.app}
      SANDBOX_APP_DOMAIN: ${SANDBOX_APP_DOMAIN:-app.sndbox.app}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m

  alloy:
    image: grafana/alloy:v1.18.1
    profiles: [observability]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
      OTEL_RESOURCE_ATTRIBUTES: grafana.host.id=${GRAFANA_HOST_ID:-sandbox-marketing-do-01}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "${SANDBOX_ALLOY_HTTP_BIND:-127.0.0.1}:12345:12345"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m

  runner:
    image: ghcr.io/sndboxhq/sandbox-server-runner:${SANDBOX_VERSION:-0.8.0-beta.1}
    profiles: [runner]
    restart: unless-stopped
    command: ["--config", "/etc/sandbox/runner.toml", "run"]
    volumes:
      - ./runner.toml:/etc/sandbox/runner.toml:ro
      - ./data:/var/lib/sandbox-runner
      - ./automation:/srv/automation
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 192
    mem_limit: 512m

volumes:
  alloy-data:
  caddy-data:
  caddy-config:
