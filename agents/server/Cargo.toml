[package]
name = "sandbox-server-runner"
version = "0.8.0-beta.1"
edition = "2021"

[dependencies]
base64 = "0.22"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive","env"] }
ed25519-dalek = { version = "3", features = ["pkcs8","rand_core","alloc"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking","json","multipart","rustls-tls"] }
rpassword = "7"
keyring = { version = "4.1", features = ["v1"] }
parking_lot = "0.12"
sandbox-engine = { path = "../../src-tauri/engine" }
sandbox-plugin-runtime = { path = "../../src-tauri/plugin-runtime" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4","v5","serde"] }
zeroize = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
zip = { version = "8.6.0", default-features = false }
