<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" href="/sndbox-icon.svg" />
    <title>sndbox</title>
    <style>
      html,body,#root{width:100%;height:100%;margin:0}body{background:#09090a;color:#f1f1f3;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot-screen{height:100%;display:grid;place-items:center;background:#09090a}.boot-card{display:flex;flex-direction:column;align-items:center;gap:14px}.boot-logo{width:52px;height:52px;border-radius:11px;box-shadow:0 12px 34px rgba(0,0,0,.28)}.boot-brand{font-size:15px;font-weight:650;letter-spacing:-.02em}.boot-spinner{width:18px;height:18px;border:2px solid #34343a;border-top-color:#d6ff4b;border-radius:50%;animation:boot-spin .8s linear infinite}.boot-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes boot-spin{to{transform:rotate(360deg)}}html[data-theme="light"] body,html[data-theme="light"] .boot-screen{background:#f4f4f2;color:#171718}html[data-theme="light"] .boot-spinner{border-color:#d4d4d0;border-top-color:#627d00}@media(prefers-reduced-motion:reduce){.boot-spinner{animation-duration:1.6s}}
    </style>
    <script>
      (() => {
        try {
          const next = JSON.parse(localStorage.getItem("sandbox.app-preferences.v2") || "null");
          const old = JSON.parse(localStorage.getItem("sandbox.app-preferences.v1") || "null");
          const choice = next?.colorScheme || (old ? "dark" : "system");
          const dark = matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = choice === "system" ? (dark ? "dark" : "light") : choice;
          document.documentElement.dataset.surface = next?.darkSurface || old?.surfaceTheme || "charcoal";
        } catch { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-card">
          <img class="boot-logo" src="/sndbox-icon.svg" alt="" />
          <div class="boot-brand">sndbox</div>
          <div class="boot-spinner" aria-hidden="true"></div>
          <span class="boot-label">Loading sndbox</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
