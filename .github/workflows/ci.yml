name: Complete test suite

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  linux-runner-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Linux runner installer
        run: sh agents/server/packaging/install.test.sh

  node-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sandbox_test
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox -d sandbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sandbox:sandbox@127.0.0.1:5432/sandbox_test
      TEST_DATABASE_URL: postgresql://sandbox:sandbox@127.0.0.1:5432/sandbox_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/docs/package-lock.json
      - run: npm ci
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate --workspace @sandbox/control-plane
      - run: npm run test:node

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri
            services/hosted-runner
            agents/server
      - name: Check frontend node contract snapshot
        run: npm run node-contracts:check
      - name: Test desktop Rust workspace
        env:
          # Unit tests do not package the generated Node/Chromium sidecar. The release
          # workflow prepares and validates those resources before `tauri build`.
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --no-fail-fast
      - run: cargo test --manifest-path services/hosted-runner/Cargo.toml --no-fail-fast
      - run: cargo test --manifest-path agents/server/Cargo.toml --no-fail-fast
