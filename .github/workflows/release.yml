name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Jobs opt into only the token permissions they need.
permissions: {}

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Verify immutable release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.NUMBER." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$version" != "$package_version" || "$version" != "$tauri_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package ($package_version) and Tauri ($tauri_version) versions." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  desktop-windows:
    needs: verify-release
    runs-on: windows-latest
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      RELEASE_IS_PRERELEASE: ${{ needs.verify-release.outputs.prerelease }}
      SANDBOX_ACCOUNT_AUTH_URL: ${{ vars.SANDBOX_ACCOUNT_AUTH_URL }}
      SANDBOX_ACCOUNT_TOKEN_URL: ${{ vars.SANDBOX_ACCOUNT_TOKEN_URL }}
      SANDBOX_ACCOUNT_AUDIENCE: ${{ vars.SANDBOX_ACCOUNT_AUDIENCE }}
      SANDBOX_ACCOUNT_CLIENT_ID: ${{ vars.SANDBOX_NATIVE_CLIENT_ID }}
      SANDBOX_CONTROL_PLANE_URL: ${{ vars.SANDBOX_CONTROL_PLANE_URL }}
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify desktop account configuration
        shell: pwsh
        run: |
          $required = @(
            "SANDBOX_ACCOUNT_AUTH_URL",
            "SANDBOX_ACCOUNT_TOKEN_URL",
            "SANDBOX_ACCOUNT_AUDIENCE",
            "SANDBOX_ACCOUNT_CLIENT_ID",
            "SANDBOX_CONTROL_PLANE_URL"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name must be configured as a production-release environment variable."
            }
          }
      - name: Configure Windows signing policy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $isPrerelease = $env:RELEASE_IS_PRERELEASE -eq "true"
          if ($isPrerelease) {
            "WINDOWS_INSTALLER_SIGNED=false" >> $env:GITHUB_ENV
            Write-Warning "This invite-only prerelease will publish an unsigned Windows installer. Windows SmartScreen warnings are expected."
            return
          }
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD -or -not $env:WINDOWS_TIMESTAMP_URL) {
            throw "Stable releases require WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD and WINDOWS_TIMESTAMP_URL."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "sandbox-release.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false
          Remove-Item -LiteralPath $pfxPath -Force
          if (-not $certificate.HasPrivateKey) { throw "The release certificate has no private key." }
          if ($certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow.AddDays(14)) { throw "The release certificate expires within 14 days." }
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          if (-not ($certificate.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid)) { throw "The certificate is not authorized for code signing." }
          $overlay = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = $env:WINDOWS_TIMESTAMP_URL } } }
          $overlayPath = Join-Path $env:RUNNER_TEMP "tauri.release.conf.json"
          $overlay | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $overlayPath -Encoding utf8
          "TAURI_RELEASE_CONFIG=$overlayPath" >> $env:GITHUB_ENV
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "WINDOWS_INSTALLER_SIGNED=true" >> $env:GITHUB_ENV
      - name: Build desktop installer
        shell: pwsh
        run: |
          if ($env:WINDOWS_INSTALLER_SIGNED -eq "true") {
            npm.cmd run desktop:build -- --config $env:TAURI_RELEASE_CONFIG
          } else {
            npm.cmd run desktop:build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify signing policy and stage installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $isSigned = $env:WINDOWS_INSTALLER_SIGNED -eq "true"
          $output = Join-Path $PWD "release\desktop"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $installers = Get-ChildItem -LiteralPath "src-tauri\target\release\bundle" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi" }
          if (-not $installers) { throw "No Windows installers were produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($isSigned) {
              if ($signature.Status -ne "Valid") { throw "$($installer.Name) has invalid Authenticode status: $($signature.Status)." }
              if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) { throw "$($installer.Name) was signed by an unexpected certificate." }
            } elseif ($signature.Status -ne "NotSigned") {
              throw "Unsigned prerelease $($installer.Name) has unexpected Authenticode status: $($signature.Status)."
            }
            Copy-Item -LiteralPath $installer.FullName -Destination $output
          }
          Get-ChildItem -LiteralPath $output -File | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content -LiteralPath (Join-Path $output "SHA256SUMS-desktop-windows") -Encoding ascii
          if (-not $isSigned) {
            @(
              "UNSIGNED WINDOWS TEST BUILD",
              "",
              "This installer is an invite-only sndbox prerelease and is not Authenticode signed.",
              "Windows SmartScreen may display an unknown publisher warning. Verify the SHA-256",
              "checksum and GitHub Actions release record before installing it. Do not redistribute it",
              "as a production release."
            ) | Set-Content -LiteralPath (Join-Path $output "UNSIGNED-WINDOWS-BETA.txt") -Encoding ascii
          }
      - name: Attest desktop artifacts when GitHub supports repository attestations
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/desktop/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-desktop-windows
          path: release
          if-no-files-found: error
          retention-days: 14

  agent-linux:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_SIGNING_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install pinned cross-compiler
        run: cargo install cargo-zigbuild --locked --version 0.23.3
      - name: Test Linux runner installer
        run: sh agents/server/packaging/install.test.sh
      - name: Build and sign Linux agent archives
        run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" agents/server/packaging/build-release.sh "${{ needs.verify-release.outputs.version }}"
      - name: Verify installable agent archives
        run: |
          set -eu
          for archive in agents/server/dist/sandbox-runner-*-linux-*.tar.gz; do
            package="$(mktemp -d)"
            install_root="$(mktemp -d)"
            tar -xzf "$archive" -C "$package"
            for file in sandbox-runner install.sh config.example.toml sandbox-runner.service README.md; do
              test -f "$package/$file"
            done
            test -x "$package/sandbox-runner"
            test -x "$package/install.sh"
            DESTDIR="$install_root" sh "$package/install.sh"
            test -x "$install_root/usr/local/bin/sandbox-runner"
            test -f "$install_root/etc/sandbox-runner/config.toml"
            test -f "$install_root/etc/systemd/system/sandbox-runner.service"
            rm -rf "$package" "$install_root"
          done
      - name: Verify agent signature
        working-directory: agents/server/dist
        run: >-
          cosign verify-blob
          --bundle SHA256SUMS.sigstore.json
          --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta|rc)\\.[0-9]+)?"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          SHA256SUMS
      - name: Stage agent release assets
        run: mkdir -p release/agent && cp agents/server/dist/* release/agent/
      - name: Attest agent artifacts when GitHub supports repository attestations
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/agent/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-agent-linux
          path: release
          if-no-files-found: error
          retention-days: 14

  containers:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.verify-release.outputs.prerelease == 'true' && 60 || 180 }}
    environment: production-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server-runner
            dockerfile: agents/server/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - name: hosted-runner
            dockerfile: services/hosted-runner/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - name: browser-worker
            dockerfile: services/browser-worker/Dockerfile
            context: .
            platforms: linux/amd64
          - name: control-plane
            dockerfile: services/control-plane/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - name: marketing
            dockerfile: apps/marketing/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - name: account
            dockerfile: apps/web/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.verify-release.outputs.prerelease != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: image
        name: Resolve immutable image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$owner/sandbox-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ needs.verify-release.outputs.prerelease == 'true' && 'linux/amd64' || matrix.platforms }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.verify-release.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify-release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache
            type=gha,scope=container-${{ matrix.name }}
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
      - name: Sign immutable image digest
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
      - name: Attest container image when GitHub supports repository attestations
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify image signature
        run: >-
          cosign verify
          --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta|rc)\\.[0-9]+)?"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
      - name: Record published digest
        run: |
          mkdir -p "release/containers"
          printf '%s@%s\n' '${{ steps.image.outputs.name }}' '${{ steps.build.outputs.digest }}' > "release/containers/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-container-${{ matrix.name }}
          path: release
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [verify-release, desktop-windows, agent-linux, containers]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate machine-readable release manifest
        run: >-
          node scripts/generate-release-manifest.mjs
          --input release
          --output release/release-manifest.json
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --generate-notes --title "sndbox $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --notes $'> [!WARNING]\n> The Windows installer in this invite-only prerelease is not Authenticode signed. Windows may show an unknown publisher or SmartScreen warning. Verify its SHA-256 checksum and GitHub provenance before installation.')
          fi
          gh release create "$GITHUB_REF_NAME" "${release_flags[@]}"
          find release -type f -print0 | sort -z | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber

  deploy-digitalocean:
    needs: [verify-release, publish-release]
    if: ${{ vars.DEPLOY_DIGITALOCEAN == 'true' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      version: ${{ needs.verify-release.outputs.version }}
      deployment: website
    secrets: inherit
